name: local-profile
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: local-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Ensure Graphviz is available
        timeout-minutes: 2
        run: |
          if command -v dot >/dev/null 2>&1; then
            dot -V
            exit 0
          fi
          sudo timeout 40s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update || true
          sudo timeout 60s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 install -y --no-install-recommends graphviz
          dot -V
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: make build test docs
      - run: make acceptance RUN_ID=ci-engineering PROFILE=diagnostic
      - run: make verify EVIDENCE=evidence/ci-engineering
      - run: make negative-controls EVIDENCE=evidence/ci-engineering RUN_ID=ci-controls
      - run: make stress RUN_ID=ci-http
      - run: make train RUN_ID=ci-training
      - run: python3 -m matchpulse.verify_training evidence/ci-training
      - run: python3 scripts/package.py --output evidence/matchpulse-diagnostic.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-diagnostic-${{ github.sha }}
          path: evidence/
          retention-days: 14
